[project]
name = "stylegan2-ada-pytorch"
version = "0.1.0"
description = "StyleGAN2-ADA"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "pillow>=10.0.0",
    "imageio>=2.30.0",
    "imageio-ffmpeg>=0.4.0",
    "scipy>=1.10.0",
    "click>=8.0.0",
    "requests>=2.28.0",
    "tqdm>=4.65.0",
    "opensimplex>=0.4.5",
    "ninja>=1.10.0",
    "ftfy>=6.0.0",
]

[project.optional-dependencies]
touchdesigner = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
]

dev = [
    "timm>=0.4.0",
    "pyspng>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
index-url = "https://download.pytorch.org/whl/cu118"
extra-index-url = ["https://pypi.org/simple"]

[tool.uv.sources]
torch = { index = "pytorch" }
torchvision = { index = "pytorch" }

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu118"
explicit = true
